<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Notifications</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 20px;
        }
        #notification-container {
            margin-top: 20px;
            padding: 10px;
            max-width: 400px;
            margin: auto;
        }
        .notification {
            background: #fffa90;
            padding: 10px;
            margin: 5px;
            border: 1px solid #ccc;
        }
        input, button {
            margin-top: 10px;
            padding: 10px;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <h1>Real-Time Notifications</h1>

    <!-- Notifications Display -->
    <div id="notification-container"></div>

    <!-- Admin Panel to Send Notifications -->
    <h2>Send Notification</h2>
    <input type="text" id="notifMessage" placeholder="Enter notification">
    <button onclick="sendNotification()">Send</button>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBmu9bPoXOyM16YZrKqhl9opmPhUd9lOSg",
            authDomain: "brosena-e7b05.firebaseapp.com",
            databaseURL: "https://brosena-e7b05-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "brosena-e7b05",
            storageBucket: "brosena-e7b05.firebasestorage.app",
            messagingSenderId: "332544763205",
            appId: "1:332544763205:web:e3d9eb47101420093c0a2c",
            measurementId: "G-BWBVKQBQPV"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // Function to display notifications
        function displayNotification(message) {
            let container = document.getElementById("notification-container");
            let notifDiv = document.createElement("div");
            notifDiv.classList.add("notification");
            notifDiv.innerText = message;
            container.appendChild(notifDiv);
        }

        // Listen for new notifications
        database.ref("notifications").on("child_added", (snapshot) => {
            let data = snapshot.val();
            displayNotification(data.message);
        });

        // Function to send notification (Admin)
        function sendNotification() {
            let message = document.getElementById("notifMessage").value;
            if (message) {
                database.ref("notifications").push({ message });
                alert("Notification Sent!");
                document.getElementById("notifMessage").value = "";
            }
        }
    </script>
</body>
</html>
